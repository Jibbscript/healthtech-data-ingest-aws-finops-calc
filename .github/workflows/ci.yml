name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - run: make proto
      - run: go test ./...
      - run: go build ./cmd/...

  web-cost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/cost/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
