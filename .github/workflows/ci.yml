name: ci

on:
  pull_request:
  push:
    branches: [masta]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      # Build/test against the committed internal/gen stubs. Proto regeneration
      # and drift checking are owned by the dedicated proto.yml workflow, which
      # installs buf; this job must not require the proto toolchain.
      - run: go test ./...
      - run: go build ./cmd/...

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: make lint
      - run: make docker-config
      - name: Prometheus rules syntax
        run: docker run --rm --entrypoint promtool -v "$PWD:/workspace" -w /workspace prom/prometheus:v2.55.1 check rules infra/modules/observability/alerts/prometheus-alerts.yaml
      - name: Prometheus config syntax
        run: docker run --rm --entrypoint promtool -v "$PWD:/workspace" -w /workspace prom/prometheus:v2.55.1 check config grafana/provisioning/prometheus.yml

  web-cost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/cost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/cost/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
