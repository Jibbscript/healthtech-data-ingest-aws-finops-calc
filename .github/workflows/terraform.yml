name: terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'grafana/provisioning/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [masta]
    paths:
      - 'infra/**'
      - 'grafana/provisioning/**'
      - '.github/workflows/terraform.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..
      - name: Terraform init without backend
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
      - name: TFLint
        uses: terraform-linters/setup-tflint@v6
      - name: Run tflint
        run: |
          cd ../..
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      # tfsec is EOL (folded into Trivy). exit-code: '1' keeps this a blocking
      # gate (tfsec-action failed on findings; trivy-action defaults to 0).
      - name: Trivy IaC misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          trivyignores: infra/.trivyignore
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
