name: proto

on:
  pull_request:
    paths:
      - 'api/proto/**'
      - 'internal/gen/**'
      - 'api/openapi/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - '.github/workflows/proto.yml'
  push:
    branches: [masta]
    paths:
      - 'api/proto/**'
      - 'internal/gen/**'
      - 'api/openapi/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - '.github/workflows/proto.yml'

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint proto
        run: buf lint
      - name: Breaking check against default branch
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=${{ github.event.repository.default_branch }}'
      - name: Generate deterministic PoC stubs
        run: make proto
      - name: Ensure generated files are committed
        run: git diff --exit-code
