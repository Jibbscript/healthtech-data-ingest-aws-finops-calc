name: proto

on:
  pull_request:
    paths:
      - 'api/proto/**'
      - 'internal/gen/**'
      - 'api/openapi/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - '.github/workflows/proto.yml'
  push:
    branches: [masta]
    paths:
      - 'api/proto/**'
      - 'internal/gen/**'
      - 'api/openapi/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - '.github/workflows/proto.yml'

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      # buf-setup-action has no Node 24 release; buf-action (setup_only) is its
      # node24 successor and installs only the buf CLI, like-for-like.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      # genproto (make proto) shells out to these protoc plugins; buf-action
      # only provides buf itself, so install them and put them on PATH.
      - name: Install protoc plugins
        run: |
          ./scripts/install-proto-tools.sh
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        run: buf lint
      # checkout (fetch-depth: 0) does not create a local default-branch ref on
      # pull_request events, so fetch it before buf compares against it.
      - name: Breaking check against default branch
        if: github.event_name == 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/heads/$DEFAULT_BRANCH"
          buf breaking --against ".git#branch=$DEFAULT_BRANCH"
      - name: Generate deterministic PoC stubs
        run: make proto
      - name: Ensure generated files are committed
        run: git diff --exit-code
