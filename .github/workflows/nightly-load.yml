name: nightly-load

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Load target URL
        required: false
        default: http://localhost:8080
      duration:
        description: Load duration
        required: false
        default: 1m

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Build load generator
        run: go build -o /tmp/throne-load ./cmd/throne-load
      - name: Run nightly light load
        run: /tmp/throne-load --devices 10 --captures-per-device-per-day 3 --duration "${{ inputs.duration || '1m' }}" --target "${{ inputs.target || 'http://localhost:8080' }}"
