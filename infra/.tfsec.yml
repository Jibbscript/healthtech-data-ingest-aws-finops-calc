minimum_severity: LOW
exclude:
  # PoC/dev exceptions documented before production hardening.
  - aws-rds-enable-performance-insights # Dev DB keeps cost low; revisit before prod.
  - aws-ec2-no-public-egress-sgr # Dev ECS tasks need package/OTLP egress until endpoints are complete.
  - aws-ec2-no-public-ingress-sgr # Public ALB ingress is intentional for the demo edge.
  - aws-ec2-no-public-ip-subnet # Public subnets exist for ALB/NAT; tasks remain private.
  - aws-rds-enable-iam-auth # Password auth via SSM is the PoC path; IAM auth is a prod hardening item.
  - aws-rds-enable-deletion-protection # Dev sandbox must be destroyable.
  - aws-ec2-require-vpc-flow-logs-for-all-vpcs # Deferred to prod hardening to avoid noisy dev log spend.
  - aws-s3-enable-bucket-logging # Deferred for PoC; CloudTrail/server logs are prod hardening.
  - aws-cloudwatch-log-group-customer-key # Dev log groups use service-managed encryption for cost/simplicity.
  - AWS0176 # tfsec rego ID for RDS IAM auth.
  - AWS0177 # tfsec rego ID for RDS deletion protection.
